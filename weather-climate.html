<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script data-goatcounter="https://shawnlemko.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<title>Weather and Climate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard look (shared with the math visuals site).
   One colour per idea, used in every scene and in the practice pictures:
   blue = cold air, red-orange = warm air, yellow = sunlight, red = heat leaving the ground, light blue = water and vapour.
   Layout: one screen. Top = scene tabs. Then one row of controls. Then the picture. */
:root{
  --bg:#f5f8fb; --surface:#ffffff; --surface-2:#eaf0f6; --ink:#1b2733; --muted:#5b6b7a; --line:#dbe5ee; --line-strong:#b9c9d8; --pt:#2f5fd0;
  --cold:#2563d6; --warm:#d9542b; --sun:#e9a800; --ir:#d1293f; --good:#13874b; --bad:#d1293f;
  --sky1:#b9dcf7; --sky2:#eef7fe; --space:#1b2a44; --ground:#86b25c; --soil:#9a7651; --rock:#8d8a83; --sea:#3b8fd4;
  --cloud:#ffffff; --cloud-dk:#8995a3; --rain:#1f63d0; --vap:#5aa9e6; --snow:#ffffff; --ghg:#2b9a8f; --house:#c9a36b;
  --btn:#2f5fd0; --btn-ink:#ffffff;
  --font-ui:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-num:'Spline Sans Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#151f29; --surface-2:#1d2935; --ink:#e6edf3; --muted:#9aabbb; --line:#1f2c38; --line-strong:#2e3f50; --pt:#7aa2ff;
  --cold:#6ea4ff; --warm:#ff8a5c; --sun:#ffc933; --ir:#ff6b7d; --good:#45c985; --bad:#ff6b7d;
  --sky1:#1c3550; --sky2:#2a4763; --space:#070d18; --ground:#4f7a3a; --soil:#5e4630; --rock:#5c5a55; --sea:#245f99;
  --cloud:#d5dde5; --cloud-dk:#6c7987; --rain:#8ab8ff; --vap:#7cc0f2; --snow:#eef4fa; --ghg:#4cc4b6; --house:#b48a52;
  --btn:#7aa2ff; --btn-ink:#0f161d; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#151f29; --surface-2:#1d2935; --ink:#e6edf3; --muted:#9aabbb; --line:#1f2c38; --line-strong:#2e3f50; --pt:#7aa2ff;
  --cold:#6ea4ff; --warm:#ff8a5c; --sun:#ffc933; --ir:#ff6b7d; --good:#45c985; --bad:#ff6b7d;
  --sky1:#1c3550; --sky2:#2a4763; --space:#070d18; --ground:#4f7a3a; --soil:#5e4630; --rock:#5c5a55; --sea:#245f99;
  --cloud:#d5dde5; --cloud-dk:#6c7987; --rain:#8ab8ff; --vap:#7cc0f2; --snow:#eef4fa; --ghg:#4cc4b6; --house:#b48a52;
  --btn:#7aa2ff; --btn-ink:#0f161d; color-scheme:dark; }

*,*::before,*::after{box-sizing:border-box}
h1,h2,p,ol{margin:0} ol{padding:0; list-style:none}
button,select,input{font:inherit; color:inherit}
button{border:0; background:none; cursor:pointer}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0}
#app{display:flex; flex-direction:column; gap:8px; min-height:100%; padding-block:8px}
@media (min-width:1024px){ #app{height:100%} }

/* Header */
.topbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; justify-content:space-between}
.brand{display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px}
.brand h1{font-family:var(--font-display); font-weight:800; font-size:clamp(20px, 2vw, 26px); line-height:1.1; letter-spacing:-.01em; text-wrap:balance}
a.main-btn{display:inline-flex; align-items:center; gap:8px; padding:8px 16px; min-height:42px; background:var(--pt); color:#fff; font-family:var(--font-display); font-weight:800; font-size:16px; text-decoration:none; border-radius:10px; border:2px solid var(--pt); flex:none}
a.main-btn span{font-size:19px; line-height:1}
a.main-btn:hover{background:var(--surface); color:var(--pt)}
a.main-btn:focus-visible{outline:3px solid var(--pt); outline-offset:3px}
.top-right{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.mode{display:flex; flex-wrap:wrap; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px}
.mode button{border-radius:999px; padding:6px 16px; font-weight:700; font-size:15px; color:var(--muted); line-height:1.1}
.mode button[aria-checked="true"]{background:var(--btn); color:var(--btn-ink)}
.guide-wrap{position:relative}
.btn-outline{border:1.5px solid var(--ink); border-radius:8px; padding:7px 12px; font-weight:700; font-size:14px; background:var(--surface)}
.pop{position:absolute; right:0; top:calc(100% + 8px); width:min(340px, calc(100vw - 32px)); z-index:20; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 32px rgba(10,20,30,.18); padding:14px 16px}
.pop h2{font-weight:700; font-size:15px; margin-bottom:8px}
.pop ol{display:flex; flex-direction:column; gap:10px}
.pop li{display:grid; grid-template-columns:24px 1fr; gap:8px; line-height:1.4}
.pop .n{width:22px; height:22px; border-radius:50%; background:var(--btn); color:var(--btn-ink); font-weight:700; font-size:12px; display:grid; place-items:center}
.pop .tip{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); line-height:1.45; color:var(--muted)}

.panel{background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; min-width:0}
button:focus-visible, input:focus-visible{outline:2.5px solid var(--pt); outline-offset:2px}

/* Controls */
.controls{display:flex; flex-wrap:wrap; gap:8px 22px; padding:8px 14px; align-items:end}
.ctl{display:flex; flex-direction:column; gap:3px; min-width:200px; flex:1 1 200px}
.ctl.seg-ctl{flex:0 1 auto; min-width:0}
.ctl-top{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:30px}
.ctl label, .ctl .lab{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:700}
.ctl output{font-family:var(--font-num); font-variant-numeric:tabular-nums; font-weight:700; font-size:15px}
.ctl input[type=range]{width:100%; accent-color:var(--pt); margin:2px 0}
.seg{display:flex; gap:3px; background:var(--surface-2); border-radius:9px; padding:3px}
.seg button{padding:6px 14px; border-radius:7px; font-weight:700; font-size:15px; color:var(--muted); white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
.seg button[aria-checked="true"]{background:var(--surface); color:var(--ink); box-shadow:0 0 0 1.5px var(--ink)}
.seg button svg{flex:none}
.btn-primary{background:var(--btn); color:var(--btn-ink); border-radius:8px; padding:9px 18px; font-weight:700; font-size:15px; white-space:nowrap; min-width:120px}
.ctl.go{flex:0 0 auto; min-width:0}
.ends{display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--muted)}

/* Main split */
.layout{display:grid; grid-template-columns:1fr; gap:10px; flex:1; min-height:0}
@media (min-width:1024px){ .layout.side{grid-template-columns:1fr 300px; grid-template-rows:minmax(0,1fr)} }
.stage{position:relative; min-height:420px; overflow:hidden}
@media (min-width:1024px){ .stage{min-height:0} }
@media (max-width:1023px){ .stage{min-height:0; aspect-ratio:1000 / 640} }
.stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.badge{position:absolute; left:12px; top:10px; z-index:2; display:flex; flex-direction:column; gap:3px; padding:6px 14px 8px; border-radius:10px;
  border:2.5px solid var(--ink); background:var(--surface); max-width:calc(100% - 24px)}
.badge .b-main{font-family:var(--font-display); font-weight:800; font-size:clamp(16px, 1.6vw, 21px); line-height:1.15; display:flex; align-items:center; gap:10px}
.badge .b-sub{font-size:15px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px}
.badge.cold{border-color:var(--cold)} .badge.cold .b-main{color:var(--cold)}
.badge.warm{border-color:var(--warm)} .badge.warm .b-main{color:var(--warm)}
.badge.heat{border-color:var(--ir)} .badge.heat .b-main{color:var(--ir)}
.chip{white-space:nowrap; display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px; font-weight:700; font-size:13.5px; background:var(--surface-2)}
.chip.now{background:var(--vap); color:#06233d}
.arr{color:var(--muted); font-weight:700}

/* Climate effect cards */
.effects{display:flex; flex-direction:column; gap:10px; padding:10px 12px; overflow:auto; min-height:0}
@media (max-width:1023px){ .effects{flex-direction:row; flex-wrap:wrap} .effects .ecard{flex:1 1 180px} }
.ecard{border:1px solid var(--line); border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:12px}
.ecard svg{width:120px; height:84px; flex:none}
.ecard .e-txt{display:flex; flex-direction:column; gap:6px}
.ecard .e-name{font-weight:700; font-size:15px}
.ecard .chip.up{background:var(--ir); color:#fff}
.ecard .chip.down{background:var(--cold); color:#fff}

/* Practice */
.practice{flex:1; display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px; overflow:auto}
.pdots{display:flex; gap:8px}
.pdots span{width:14px; height:14px; border-radius:50%; background:var(--surface-2); border:2px solid var(--line-strong)}
.pdots span.ok{background:var(--good); border-color:var(--good)}
.pdots span.no{background:var(--bad); border-color:var(--bad)}
.pdots span.cur{border-color:var(--ink)}
.qpic{width:min(100%, 560px); aspect-ratio:400 / 210; border-radius:10px; border:1px solid var(--line); overflow:hidden; flex:none}
.qpic svg{width:100%; height:100%; display:block}
.qprompt{font-family:var(--font-display); font-weight:800; font-size:clamp(20px, 2.2vw, 26px); text-align:center}
.answers{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:min(100%, 640px)}
.answers button{flex:1 1 140px; min-height:54px; border-radius:10px; border:2px solid var(--line-strong); background:var(--surface); font-weight:700; font-size:18px; padding:8px 14px}
.answers button:hover:not(:disabled){border-color:var(--pt)}
.answers button.right{background:var(--good); border-color:var(--good); color:#fff}
.answers button.wrong{background:var(--bad); border-color:var(--bad); color:#fff}
.answers button:disabled{cursor:default}
.why{min-height:1.5em; font-size:17px; font-weight:700; text-align:center}
.why.ok{color:var(--good)} .why.no{color:var(--bad)}
.score{font-family:var(--font-display); font-weight:800; font-size:clamp(34px, 5vw, 56px)}
.stars{font-size:40px; letter-spacing:6px; color:var(--sun)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
      <h1>Weather and Climate</h1>
    </div>
    <div class="top-right">
      <div class="mode" role="radiogroup" aria-label="Scene">
        <button type="button" data-scene="fronts" role="radio" aria-checked="true">Fronts</button>
        <button type="button" data-scene="water" role="radio" aria-checked="false">Water Cycle</button>
        <button type="button" data-scene="climate" role="radio" aria-checked="false">Climate</button>
        <button type="button" data-scene="practice" role="radio" aria-checked="false">Practice</button>
      </div>
      <div class="guide-wrap">
        <button type="button" id="guideBtn" class="btn-outline" aria-expanded="false" aria-controls="guidePop">Guide</button>
        <div id="guidePop" class="pop" hidden>
          <h2>How to use this</h2>
          <ol id="guideList"></ol>
          <p class="tip" id="guideTip"></p>
        </div>
      </div>
    </div>
  </header>

  <section class="panel controls" id="frontsCtl" aria-label="Front controls">
    <div class="ctl seg-ctl">
      <div class="ctl-top"><span class="lab" id="frontLab">Front</span></div>
      <div class="seg" role="radiogroup" aria-labelledby="frontLab">
        <button type="button" data-front="cold" role="radio" aria-checked="true">
          <svg width="34" height="14" viewBox="0 0 34 14" aria-hidden="true"><path d="M1 12H33" style="stroke:var(--cold); stroke-width:2.5"/><path d="M4 12L9 3L14 12ZM19 12L24 3L29 12Z" style="fill:var(--cold)"/></svg>Cold front</button>
        <button type="button" data-front="warm" role="radio" aria-checked="false">
          <svg width="34" height="14" viewBox="0 0 34 14" aria-hidden="true"><path d="M1 12H33" style="stroke:var(--warm); stroke-width:2.5"/><path d="M4 12A5 5 0 0 1 14 12ZM19 12A5 5 0 0 1 29 12Z" style="fill:var(--warm)"/></svg>Warm front</button>
      </div>
    </div>
    <div class="ctl seg-ctl">
      <div class="ctl-top"><span class="lab" id="humidLab">Warm air</span></div>
      <div class="seg" role="radiogroup" aria-labelledby="humidLab">
        <button type="button" data-humid="1" role="radio" aria-checked="true">Humid</button>
        <button type="button" data-humid="0" role="radio" aria-checked="false">Dry</button>
      </div>
    </div>
    <div class="ctl go">
      <button type="button" id="playBtn" class="btn-primary">Pause</button>
    </div>
  </section>

  <section class="panel controls" id="waterCtl" aria-label="Water cycle controls" hidden>
    <div class="ctl">
      <div class="ctl-top"><label for="sun">Sun</label><output id="sunOut" for="sun"></output></div>
      <input type="range" id="sun" min="0" max="1" step="0.01" value="0.6">
      <div class="ends" aria-hidden="true"><span>Cold</span><span>Hot</span></div>
    </div>
    <div class="ctl go">
      <button type="button" id="followBtn" class="btn-primary">Follow a drop</button>
    </div>
  </section>

  <section class="panel controls" id="climateCtl" aria-label="Climate controls" hidden>
    <div class="ctl">
      <div class="ctl-top"><label for="ghg">Greenhouse gases</label><output id="ghgOut" for="ghg"></output></div>
      <input type="range" id="ghg" min="280" max="1000" step="5" value="425">
      <div class="ends" aria-hidden="true"><span>Less</span><span>More</span></div>
    </div>
    <div class="ctl seg-ctl">
      <div class="ctl-top"><span class="lab" id="yearLab">Jump to</span></div>
      <div class="seg" role="radiogroup" aria-labelledby="yearLab">
        <button type="button" data-ppm="280" role="radio" aria-checked="false">1850</button>
        <button type="button" data-ppm="425" role="radio" aria-checked="true">Today</button>
        <button type="button" data-ppm="560" role="radio" aria-checked="false">Double</button>
      </div>
    </div>
  </section>

  <main class="layout" id="layout">
    <section class="panel stage" id="stage">
      <div class="badge" id="badge" aria-live="polite"><span class="b-main" id="bMain"></span><span class="b-sub" id="bSub"></span></div>
      <canvas id="cv" aria-label="Weather picture"></canvas>
    </section>
    <section class="panel effects" id="effects" aria-label="What changes" hidden>
      <div class="ecard">
        <svg viewBox="0 0 120 84" aria-hidden="true">
          <circle cx="60" cy="42" r="38" style="fill:var(--sea)"/>
          <path id="iceShape" style="fill:var(--snow); stroke:var(--cloud-dk); stroke-width:1"/>
        </svg>
        <div class="e-txt"><span class="e-name">Arctic ice</span><span class="chip" id="iceChip"></span></div>
      </div>
      <div class="ecard">
        <svg viewBox="0 0 120 84" aria-hidden="true">
          <rect x="0" y="0" width="120" height="84" style="fill:var(--sky2)"/>
          <rect id="seaRect" x="0" y="56" width="120" height="28" style="fill:var(--sea)"/>
          <path d="M44 84L76 40H120V84Z" style="fill:var(--ground)"/>
          <rect x="84" y="26" width="20" height="14" style="fill:var(--house)"/>
          <path d="M81 27L94 16L107 27Z" style="fill:var(--warm)"/>
          <path d="M2 56H40" style="stroke:var(--ink); stroke-width:1.5; stroke-dasharray:3 3"/>
        </svg>
        <div class="e-txt"><span class="e-name">Sea level</span><span class="chip" id="seaChip"></span></div>
      </div>
      <div class="ecard">
        <svg viewBox="0 0 120 84" aria-hidden="true" id="hotSvg"></svg>
        <div class="e-txt"><span class="e-name">Hot days</span><span class="chip" id="hotChip"></span></div>
      </div>
    </section>
    <section class="panel practice" id="practice" aria-label="Practice" hidden></section>
  </main>
</div>

<script>
/* =========================================================
   STATE AND HELPERS
   ========================================================= */
const S = {
  scene:'fronts',
  front:'cold', humid:true, playing:true, ft:0, townT:20,
  sun:0.6,
  ghg:425,
};
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const RND = Array.from({length:240}, () => Math.random());
let TT = 0;   // seconds since the page opened

let C = {};
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['ink','muted','surface','cold','warm','sun','ir','sky1','sky2','space','ground','soil','rock','sea','cloud','cloud-dk','rain','vap','snow','ghg','house'])
    C[k] = cs.getPropertyValue('--' + k).trim();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

/* =========================================================
   CANVAS: every scene is drawn in a 1000 × 560 picture, scaled to fit.
   L, R, T, B are the picture's edges after padding, so skies and ground fill the whole panel.
   ========================================================= */
const VW = 1000, VH = 560;
const cv = $('cv'), ctx = cv.getContext('2d');
let DPR = 1, VS = 1, L = 0, R = VW, T = 0, B = VH;
function resize(){
  const r = $('stage').getBoundingClientRect();
  if (!r.width || !r.height) return;
  DPR = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  VS = Math.min(r.width / VW, r.height / VH);
  const px = (r.width / VS - VW) / 2, py = (r.height / VS - VH) / 2;
  L = -px; R = VW + px; T = -py; B = VH + py;
}
new ResizeObserver(resize).observe($('stage'));
function setView(){ ctx.setTransform(DPR * VS, 0, 0, DPR * VS, DPR * VS * -L, DPR * VS * -T); }

function skyFill(top, bottom, yTop = T, yBot = B){
  const g = ctx.createLinearGradient(0, yTop, 0, yBot);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(L, yTop, R - L, yBot - yTop);
}
// Text with a halo so it reads on any background.
function label(text, x, y, {size = 24, color = C.ink, align = 'center', weight = 700, halo = C.surface} = {}){
  ctx.font = `${weight} ${size}px 'Atkinson Hyperlegible', system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.28; ctx.strokeStyle = halo; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
// A chip label (filled rounded box), used for the water cycle steps.
function chipLabel(text, x, y, on, color){
  ctx.font = `700 21px 'Atkinson Hyperlegible', system-ui, sans-serif`;
  const w = ctx.measureText(text).width + 22, h = 32;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 16);
  ctx.fillStyle = on ? color : C.surface; ctx.globalAlpha = on ? 1 : 0.88; ctx.fill(); ctx.globalAlpha = 1;
  ctx.lineWidth = on ? 0 : 1.5; ctx.strokeStyle = color; if (!on) ctx.stroke();
  ctx.fillStyle = on ? '#fff' : C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 1);
}
// A cloud with a flat base: bottom row of puffs at y, a top row above.
function puff(x, y, w, h, fill, alpha = 1){
  const r1 = h * 0.4, r2 = h * 0.5, n = Math.max(2, Math.round(w / (h * 0.8)));
  const x0 = x - w / 2 + r1, step = (w - 2 * r1) / (n - 1);
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < n; i++){ const cx = x0 + i * step; ctx.moveTo(cx + r1, y); ctx.arc(cx, y, r1, 0, Math.PI * 2); }
  for (let i = 0; i < n - 1; i++){ const cx = x0 + (i + 0.5) * step; ctx.moveTo(cx + r2, y - h * 0.25); ctx.arc(cx, y - h * 0.25, r2, 0, Math.PI * 2); }
  ctx.rect(x0, y, w - 2 * r1, r1);
  ctx.fill(); ctx.restore();
}
// Falling streaks (rain) between x0 and x1, from yTop to yBot.
function streaks(x0, x1, yTop, yBot, n, speed, len, color, width){
  const H = yBot - yTop; if (H <= 0 || x1 <= x0) return;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.beginPath();

/* =========================================================
   SCENE 1: AIR MASSES AND FRONTS (side view)
   Cold air is dense: its particles are drawn closer together and it slides under warm air.
   A cold front has a steep nose (tall storm clouds, short heavy rain).
   A warm front has a gentle slope (layered clouds, long light rain).
   ========================================================= */
const GROUND = 470, TOPC = 230, TOWN = 860, FRONT_T = 18;

  if (cold){ if (x > fx) return GROUND + 1; return GROUND - (GROUND - TOPC) * (1 - Math.exp(-(fx - x) / 70)); }

function drawFronts(dt){

  const t = clamp((S.ft % FRONT_T) / (FRONT_T - 2), 0, 1);
  const fx = cold ? lerp(40, 1000, t) : lerp(-120, 940, t);
  const top = x => coldTop(x, fx, cold);

  skyFill(C.sky1, C.sky2, T, GROUND);
  // Warm air tint everywhere, then the cold air wedge.

  ctx.lineTo(fx, GROUND); ctx.lineTo(R, GROUND); ctx.closePath();
  ctx.fillStyle = C.cold; ctx.globalAlpha = 0.22; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath();
  for (let x = L, first = true; x <= R; x += 4){ const y = top(x); if (y > GROUND) { first = true; continue; } if (first){ ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y); }
  ctx.strokeStyle = C.cold; ctx.lineWidth = 3; ctx.stroke();

  // Particles: warm spread out and jiggling fast, cold packed close and slow.
  const drift = cold ? fx : 0;
  ctx.fillStyle = C.warm;
  for (let gx = L - 40; gx < R + 40; gx += 38) for (let gy = 40; gy < GROUND - 8; gy += 38){
    const i = ((gx * 7 + gy * 13) | 0) & 239;
    const x = gx + 9 * Math.sin(TT * 5 + i), y = gy + 9 * Math.cos(TT * 4.3 + i * 1.7);

  }
  ctx.fillStyle = C.cold;
  for (let gx = L - 40 + (drift % 20); gx < R + 40; gx += 20) for (let gy = TOPC - 30; gy < GROUND - 4; gy += 20){
    const i = ((gx * 3 + gy * 11) | 0) & 239;
    const x = gx + 3 * Math.sin(TT * 2 + i), y = gy + 3 * Math.cos(TT * 1.7 + i);
    if (y > top(x) + 4 && y < GROUND - 3){ ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 7); ctx.fill(); }
  }

  // Warm air pushed up along the front.

  else arrow(fx - 70, GROUND - 20, fx + 230, GROUND - 230 * 0.4 - 50, C.warm, 9, fx + 60, GROUND - 40, 0.85);

  // Clouds and rain.
  if (cold){
    if (humid){
      streaks(fx - 30, fx + 110, 300, GROUND, 70, 520, 26, C.rain, 3);
      puff(fx + 50, 112, 260, 34, C.cloud);                          // anvil top
      puff(fx + 40, 180, 130, 80, C.cloud);
      puff(fx + 40, 240, 170, 80, C.cloud);
      puff(fx + 40, 290, 200, 70, C['cloud-dk']);
      const ph = TT % 2.7;
      if (ph < 0.14){
        ctx.strokeStyle = C.sun; ctx.lineWidth = 5; ctx.beginPath();
        ctx.moveTo(fx + 30, 310); ctx.lineTo(fx + 10, 360); ctx.lineTo(fx + 34, 370); ctx.lineTo(fx + 8, GROUND); ctx.stroke();
      }
    } else puff(fx + 50, 270, 110, 40, C.cloud);
  } else {
    const yAt = x => Math.min(330, top(x) - 60);
    if (humid){
      for (let x = fx + 40; x < fx + 330; x += 20){
        const yb = yAt(x) + 22;
        ctx.strokeStyle = C.rain; ctx.lineWidth = 2; ctx.beginPath();
        for (let k = 0; k < 3; k++){
          const i = ((x * 3 + k * 71) | 0) & 239, H = GROUND - yb;

        }

      for (let x = fx + 340; x < fx + 540; x += 60) puff(x + 30, yAt(x + 30) - 10, 100, 26, C.cloud, 0.95);
    } else {
      for (let x = fx + 300; x < fx + 500; x += 70) puff(x + 30, yAt(x + 30) - 20, 90, 18, C.cloud, 0.8);
    }
    ctx.strokeStyle = C.cloud; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let k = 0; k < 4; k++){ const x = fx + 560 + k * 45; ctx.beginPath(); ctx.moveTo(x, 120 + k * 6); ctx.quadraticCurveTo(x + 20, 112 + k * 6, x + 40, 104 + k * 6); ctx.stroke(); }
  }

  ctx.fillStyle = C.ground; ctx.fillRect(L, GROUND, R - L, 12);
  ctx.fillStyle = C.soil; ctx.fillRect(L, GROUND + 12, R - L, B - GROUND - 12);
  house(TOWN, GROUND);
  const inCold = top(TOWN) < GROUND - 2;
  S.townT += ((inCold ? TEMP_COLD : TEMP_WARM) - S.townT) * Math.min(1, dt * 1.2);
  thermometer(TOWN + 70, 360, 444, S.townT / 30, inCold ? C.cold : C.warm, `${Math.round(S.townT)} °C`);

  // Air mass names, kept clear of the town.
  if (cold){
    if (fx - L > 200) label('Cold air', clamp(fx - 190, L + 80, 720), GROUND - 50, {color:C.cold, size:28});
    if (fx - L > 260) arrow(clamp(fx - 280, L + 20, 700), GROUND - 95, clamp(fx - 120, L + 160, 840), GROUND - 95, C.cold, 9);
    label('Warm air', clamp(fx + 280, 160, 700), 150, {color:C.warm, size:28});
  } else {
    if (R - fx > 300) label('Cold air', clamp(fx + 220, 160, 720), GROUND - 40, {color:C.cold, size:28});
    label('Warm air', clamp(fx - 160, 130, 760), fx < 300 ? 160 : GROUND - 70, {color:C.warm, size:28});
    if (fx - L > 220) arrow(clamp(fx - 250, L + 20, 700), GROUND - 120, clamp(fx - 100, L + 160, 840), GROUND - 120, C.warm, 9);

const FRONT_SYM = {
  cold:`<svg width="52" height="18" viewBox="0 0 52 18" aria-hidden="true"><path d="M1 16H51" style="stroke:var(--cold); stroke-width:3"/><path d="M4 16L11 4L18 16ZM20 16L27 4L34 16ZM36 16L43 4L50 16Z" style="fill:var(--cold)"/></svg>`,
  warm:`<svg width="52" height="18" viewBox="0 0 52 18" aria-hidden="true"><path d="M1 16H51" style="stroke:var(--warm); stroke-width:3"/><path d="M4 16A7 7 0 0 1 18 16ZM20 16A7 7 0 0 1 34 16ZM36 16A7 7 0 0 1 50 16Z" style="fill:var(--warm)"/></svg>`,

function frontsBadge(){
  const cold = S.front === 'cold';
  const rain = !S.humid ? (cold ? 'Few clouds' : 'Thin clouds') : (cold ? 'Storms, short heavy rain' : 'Long, light rain');
  const after = cold ? '<span class="chip" style="color:var(--cold)">Cooler after ↓</span>' : '<span class="chip" style="color:var(--warm)">Warmer after ↑</span>';

/* =========================================================
   SCENE 2: WATER CYCLE
   Each dot is a bit of water. The Sun slider sets how fast the sea evaporates and how warm it is:
   cold = snow on the mountain, hot = the snow melts into the river.
   ========================================================= */
const SEA_Y = 400;
const LAND = [[-600, 520], [300, 520], [345, 404], [430, 392], [640, 372], [800, 150], [930, 340], [1600, 360]];
const RIVER = [[792, 190], [745, 280], [690, 345], [600, 368], [480, 384], [400, 396], [330, 404]];
const TREES = [470, 520, 570, 618];
const STEP_COL = {Evaporation:'#c2571a', Transpiration:'#1f7a5a', Condensation:'#6b7785', Precipitation:'#2563d6', Runoff:'#0f6fa8', Groundwater:'#7a3fb8', Snow:'#4a5868', Ocean:'#0f6fa8'};
function landY(x){
  for (let i = 1; i < LAND.length; i++) if (x <= LAND[i][0]){ const [x0, y0] = LAND[i - 1], [x1, y1] = LAND[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0); }

const W = {P:[], clouds:[], snow:0, evapAcc:0, trAcc:0, meltAcc:0, pulse:{}, follow:null, path:[], snowHi:false};
function pulse(step, p){ W.pulse[step] = 1; if (p && p.hi) addPath(step); }
function addPath(step){ if (W.path[W.path.length - 1] !== step) W.path.push(step); }
function spawnVapour(x, y, from){ const p = {x, y, st:'vap', vx:0, vy:-(34 + 30 * S.sun), ph:rand(0, 6), hi:false}; W.P.push(p); pulse(from, p); return p; }
function nearestCloud(x){
  let best = null, bd = 1e9;
  for (const c of W.clouds) if (!c.dying){ const d = Math.abs(c.x - x); if (d < bd){ bd = d; best = c; } }
  if (!best || bd > 230){ if (W.clouds.length >= 5) return best; best = {x:clamp(x, 140, 640), y:rand(120, 150), w:0, rainAcc:0, hi:false, dying:false, a:1}; W.clouds.push(best); }

}
function startRun(x, y, p){ p.st = 'run'; p.x = x; p.y = y; p.seg = -1; pulse('Runoff', p); }
function stepWater(dt){
  const sun = S.sun, snowing = sun < 0.35;
  if (W.P.length < 360){
    W.evapAcc += dt * (1.5 + 14 * sun);
    while (W.evapAcc >= 1){ W.evapAcc--; spawnVapour(rand(10, 330), SEA_Y, 'Evaporation'); }
    W.trAcc += dt * (0.3 + 2.5 * sun);
    while (W.trAcc >= 1){ W.trAcc--; const tx = TREES[(Math.random() * TREES.length) | 0]; spawnVapour(tx + rand(-14, 14), landY(tx) - 56, 'Transpiration'); }
  }
  if (W.snow > 0 && sun > 0.45){
    W.meltAcc += dt * (sun - 0.45) * 9;
    while (W.meltAcc >= 1 && W.snow > 0){
      W.meltAcc--; W.snow--;

      while (c.rainAcc >= 1 && c.w > 0){

        const p = {x, y:c.y + 14, st:snow ? 'snowfall' : 'rain', vy:snow ? 60 : 230, ph:rand(0, 6), hi:false};
        if (c.hi){ p.hi = true; c.hi = false; W.follow = p; }
        W.P.push(p); pulse('Precipitation', p);

    }
    if ((c.x > 430 && c.w === 0) || c.x > 960) c.dying = true;
    if (c.dying) c.a -= dt * 0.8;

    if (p.st === 'vap'){
      p.y += p.vy * dt; p.x += Math.sin(TT * 3 + p.ph) * 12 * dt;
      if (p.y < 175){ p.st = 'join'; p.cloud = nearestCloud(p.x); if (!p.cloud) p.dead = true; }
    } else if (p.st === 'join'){
      const c = p.cloud, dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
      p.x += dx / d * 120 * dt; p.y += dy / d * 120 * dt;

      if (p.y >= gy){
        if (p.x < 345){ p.dead = true; if (p.hi) addPath('Ocean'); }
        else if (p.st === 'snowfall'){ p.dead = true; W.snow++; if (p.hi){ W.snowHi = true; addPath('Snow'); } W.pulse.Snow = 1; }
        else if (Math.random() < 0.55) startRun(p.x, gy, p);
        else { p.st = 'soak'; pulse('Groundwater', p); }
      }
    } else if (p.st === 'run'){
      if (p.seg < 0){
        let bi = 0, bd = 1e9; RIVER.forEach(([x, y], i) => { const d = Math.hypot(x - p.x, y - p.y); if (d < bd){ bd = d; bi = i; } });

  }

}
function drawWater(dt){

/* =========================================================
   SCENE 3: CLIMATE ("what changes if")
   Sunlight (yellow) passes through the air and warms the ground. The ground sends heat (red) back up.
   Greenhouse gases send some heat back down, so heat stays longer near the ground.
   Model: about 2 °C of warming per doubling of CO₂ (warming seen within decades), starting at 13.8 °C in 1850.
   ========================================================= */
const BASE_T = 13.8, PER_DOUBLE = 2.0, SURF = 470;
const dT = () => PER_DOUBLE * Math.log2(S.ghg / 280);
const bounceP = () => clamp(0.3 + 0.28 * Math.log2(S.ghg / 280), 0.2, 0.85);

const K = {P:[], sunAcc:0};
function stepClimate(dt){
  K.sunAcc += dt * 7;
  while (K.sunAcc >= 1){ K.sunAcc--; const tx = rand(140, 860); K.P.push({kind:'sun', x:rand(890, 950), y:rand(50, 100), tx, ty:SURF}); }
  for (const p of K.P){
    if (p.kind === 'sun'){
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d < 8){ p.dead = true; if (K.P.length < 420) K.P.push({kind:'ir', x:p.tx, y:SURF - 4, vx:rand(-25, 25), vy:-130, ly:rand(150, 245), ph:rand(0, 6), decided:false}); }
      else { p.x += dx / d * 300 * dt; p.y += dy / d * 300 * dt; }
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.vy < 0 && !p.decided && p.y < p.ly){ p.decided = true; if (Math.random() < bounceP()){ p.vy = 130; p.flash = 0.3; } }
      if (p.vy > 0 && p.y > SURF - 4){ p.vy = -130; p.decided = false; p.ly = rand(150, 245); p.vx = rand(-25, 25); }
      if (p.x < L - 20 || p.x > R + 20) p.vx = -p.vx;
      if (p.y < T - 20) p.dead = true;
      if (p.flash) p.flash = Math.max(0, p.flash - dt);
    }
  }
  K.P = K.P.filter(p => !p.dead);
}
function drawClimate(dt){
  stepClimate(dt);

  ctx.fillStyle = C.ghg; ctx.globalAlpha = 0.08 + 0.12 * clamp((S.ghg - 280) / 720, 0, 1); ctx.fillRect(L, 140, R - L, 110); ctx.globalAlpha = 1;
  const n = Math.round(S.ghg / 12);
  ctx.fillStyle = C.ghg;
  for (let i = 0; i < n && i < MOL.length; i++){ const [x, y, ph] = MOL[i]; ctx.beginPath(); ctx.arc(x + 4 * Math.sin(TT + ph), y + 3 * Math.cos(TT * 1.3 + ph), 4.5, 0, 7); ctx.fill(); }

  // Sun
  ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(930, 60, 42, 0, 7); ctx.fill();
  // Ground: sea on the left, land on the right; glows warmer as the temperature rises.
  ctx.fillStyle = C.sea; ctx.fillRect(L, SURF, 400 - L, B - SURF);
  ctx.fillStyle = C.ground; ctx.fillRect(400, SURF, R - 400, B - SURF);
  ctx.fillStyle = C.ir; ctx.globalAlpha = clamp(warm * 0.07, 0, 0.35); ctx.fillRect(L, SURF, R - L, B - SURF); ctx.globalAlpha = 1;
  house(560, SURF, 0.9); house(650, SURF, 0.7);

}

  W.path = []; const p = spawnVapour(200, SEA_Y, 'Evaporation'); p.hi = true; W.follow = p; addPath('Evaporation'); syncUI();
});
$('ghg').addEventListener('input', e => { S.ghg = +e.target.value; syncUI(); });
document.querySelectorAll('[data-ppm]').forEach(b => b.addEventListener('click', () => { S.ghg = +b.dataset.ppm; $('ghg').value = S.ghg; syncUI(); }));
$('guideBtn').addEventListener('click', () => { const p = $('guidePop'); p.hidden = !p.hidden; $('guideBtn').setAttribute('aria-expanded', String(!p.hidden)); });
document.addEventListener('click', e => { if (!e.target.closest('.guide-wrap')){ $('guidePop').hidden = true; $('guideBtn').setAttribute('aria-expanded', 'false'); } });

let last = performance.now(), lastBadge = '', followWas = false;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; TT += dt;
  if (S.scene !== 'practice'){
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); setView();
    let b = null;
    if (S.scene === 'fronts'){ drawFronts(dt); b = frontsBadge(); }
    else if (S.scene === 'water'){ drawWater(dt); b = waterBadge(); }
    else { drawClimate(dt); b = climateBadge(); }
    const key = b ? b.cls + b.main + b.sub : '-';
    if (key !== lastBadge){
      lastBadge = key; $('badge').hidden = !b;
      if (b){ $('badge').className = 'badge ' + b.cls; $('bMain').innerHTML = b.main; $('bSub').innerHTML = b.sub; }
    }
    const fNow = !!(W.follow || W.snowHi || W.clouds.some(c => c.hi));
    if (fNow !== followWas){ followWas = fNow; syncUI(); }
  }
  requestAnimationFrame(frame);
}

readColors(); syncUI(); resize();
requestAnimationFrame(frame);
</script>
